name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (check)
        run: dotnet build Sweep.csproj -c Release

      - name: Publish (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish Sweep.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version="$ver.${{ github.run_number }}" -o publish
          # Intel PresentMon (MIT license) is bundled so Test Run works offline.
          # Pinned to one release and checked against its published SHA-256.
          $pm = "publish\PresentMon.exe"
          Invoke-WebRequest -Uri "https://github.com/GameTechDev/PresentMon/releases/download/v2.5.1/PresentMon-2.5.1-x64.exe" -OutFile $pm
          $hash = (Get-FileHash $pm -Algorithm SHA256).Hash
          Write-Host "PresentMon SHA256: $hash"
          if ($hash -ne "9BEC3083069F58F911E6A512F4806DB51A27BD096103087BC1D05EF54C80A191") { throw "PresentMon hash mismatch: $hash" }
          Copy-Item THIRD_PARTY_NOTICES.txt publish\
          Compress-Archive -Path publish\* -DestinationPath "Sweep-${{ github.ref_name }}-win-x64.zip"

      - name: Create GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "Sweep-$tag-win-x64.zip"
          $title = (Get-Content RELEASE_NOTES.md -TotalCount 1).TrimStart('#').Trim()
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            # release was made in the GitHub web page: attach the build and set title/notes
            gh release upload $tag $zip --clobber
            gh release edit $tag --title "$title" --notes-file RELEASE_NOTES.md
          } else {
            gh release create $tag $zip --title "$title" --notes-file RELEASE_NOTES.md
          }
